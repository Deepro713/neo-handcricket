[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-handcricket"
version = "0.3.0"
description = "A single-player CLI hand cricket game with proper match formats."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Deepro Mallick"}]
dependencies = ["rich>=13.0"]

[project.scripts]
neo-handcricket = "neo_handcricket.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["neo_handcricket*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tools/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
